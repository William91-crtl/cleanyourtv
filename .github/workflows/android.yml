
name: Build CleanYourTV APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: launcher/**/*.gradle*

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accepter les licences Android
        run: yes | sdkmanager --licenses

      - name: Installer les outils Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Autoriser Gradle
        run: chmod +x gradlew
        working-directory: launcher

      - name: Compiler CleanYourTV
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: launcher

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-debug-apk
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
